name: Azure Functions CI/CD (Infra + App)

on:
  push:
    branches: [ main ]

env:
  AZURE_RESOURCE_GROUP: rahul-ai-test
  AZURE_LOCATION: centralus
  FUNCTION_APP_NAME: azure-func-demo-rahul-ci

jobs:
  infra:
    name: Deploy infrastructure (Bicep)
    runs-on: ubuntu-latest
    outputs:
      functionAppName: ${{ steps.deploy-infra.outputs.functionAppName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure required resource providers (safe)
        run: |
          set -e
          providers=("Microsoft.OperationalInsights" "Microsoft.Insights" "Microsoft.Storage")
          for p in "${providers[@]}"; do
            state=$(az provider show -n $p --query registrationState -o tsv || echo "Unknown")
            echo "$p registration state: $state"
            if [ "$state" != "Registered" ]; then
              echo "Attempting to register $p"
              if az provider register -n $p; then
                # Wait for registration to complete (timeout ~3 minutes)
                for i in $(seq 1 36); do
                  state=$(az provider show -n $p --query registrationState -o tsv)
                  echo "$p registration state: $state"
                  if [ "$state" = "Registered" ]; then
                    break
                  fi
                  sleep 5
                done
              else
                echo "Warning: failed to register $p. This may be due to insufficient permissions for the service principal. Continuing without registration."
              fi
            fi
          done

      - name: Deploy Bicep template
        id: deploy-infra
        run: |
          set -e
          az deployment group create -g $AZURE_RESOURCE_GROUP -f infra/main.bicep -p functionAppName=$FUNCTION_APP_NAME location=$AZURE_LOCATION -o json > infra_output.json
          echo "infra_output=$(cat infra_output.json)"
          functionAppName=$(jq -r '.properties.outputs.functionAppName.value' infra_output.json)
          echo "functionAppName=$functionAppName" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy Function App
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          zip -r deploy.zip function_app.py host.json requirements.txt || true

      - name: Deploy package (zip deploy)
        run: |
          set -e
          funcApp=${{ needs.infra.outputs.functionAppName }}
          echo "Deploying to $funcApp"
          # Use `az webapp deploy` which supports remote zip deployment for Linux apps
          az webapp deploy --resource-group $AZURE_RESOURCE_GROUP --name $funcApp --src-path deploy.zip --type zip -o json

      - name: List deployments
        run: az functionapp deployment list --name ${{ needs.infra.outputs.functionAppName }} --resource-group $AZURE_RESOURCE_GROUP -o table
