name: Azure Functions CI/CD (Infra + App)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      iac_tool:
        description: 'Infrastructure as Code tool to use'
        required: true
        default: 'terraform'
        type: choice
        options:
          - bicep
          - terraform
      resource_group:
        description: 'Azure Resource Group name'
        required: true
        default: 'rahul-ai-test'
        type: string
      location:
        description: 'Azure region for deployment'
        required: true
        default: 'centralus'
        type: string
      function_app_name:
        description: 'Function App name (must be globally unique)'
        required: true
        default: 'azure-func-demo-rahul-ci'
        type: string
      app_name:
        description: 'Application name (APP_NAME setting)'
        required: true
        default: 'azure-func-demo-rahul'
        type: string
      app_version:
        description: 'Application version (APP_VERSION setting)'
        required: true
        default: '1.0.0'
        type: string

permissions:
  id-token: write   # required for azure/login OIDC
  contents: read

env:
  # Use workflow inputs if provided (manual trigger), otherwise use defaults (push trigger)
  AZURE_RESOURCE_GROUP: ${{ github.event.inputs.resource_group || 'rahul-ai-test' }}
  AZURE_LOCATION: ${{ github.event.inputs.location || 'centralus' }}
  FUNCTION_APP_NAME: ${{ github.event.inputs.function_app_name || 'azure-func-demo-rahul-ci' }}
  APP_NAME: ${{ github.event.inputs.app_name || 'azure-func-demo-rahul' }}
  APP_VERSION: ${{ github.event.inputs.app_version || '1.0.0' }}
  IAC_TOOL: ${{ github.event.inputs.iac_tool || 'terraform' }}

jobs:
  infra:
    name: Deploy infrastructure (${{ github.event.inputs.iac_tool || 'terraform' }})
    runs-on: ubuntu-latest
    outputs:
      functionAppName: ${{ steps.setapp.outputs.functionAppName }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:     ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:     ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure required resource providers (safe)
        run: |
          set -e
          az provider register --namespace Microsoft.OperationalInsights --wait
          az provider register --namespace Microsoft.Insights --wait
          az provider register --namespace Microsoft.Storage --wait

      # ------------------------------
      # BICEP DEPLOYMENT
      # ------------------------------
      - name: Deploy Bicep template
        id: deploy-bicep
        if: env.IAC_TOOL == 'bicep'
        run: |
          set -e
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters functionAppName="$FUNCTION_APP_NAME" location="$AZURE_LOCATION" \
            --mode Incremental \
            --query properties.outputs -o json > infra_output.json
          cat infra_output.json

      # ------------------------------
      # TERRAFORM DEPLOYMENT
      # ------------------------------
      - name: Setup Terraform
        if: env.IAC_TOOL == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        id: tf-init
        if: env.IAC_TOOL == 'terraform'
        working-directory: infra/terraform
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: terraform init

      - name: Terraform Plan
        id: tf-plan
        if: env.IAC_TOOL == 'terraform'
        working-directory: infra/terraform
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: |
          terraform plan \
            -refresh=true \
            -var="function_app_name=$FUNCTION_APP_NAME" \
            -var="location=$AZURE_LOCATION" \
            -var="resource_group_name=$AZURE_RESOURCE_GROUP" \
            -var="app_name=${{ env.APP_NAME }}" \
            -var="app_version=${{ env.APP_VERSION }}" \
            -out=tfplan

      - name: Terraform Apply
        id: deploy-terraform
        if: env.IAC_TOOL == 'terraform'
        working-directory: infra/terraform
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
        run: |
          terraform apply -auto-approve tfplan
          # Create output file in same format as Bicep for compatibility
          echo "{\"functionAppName\":{\"value\":\"$(terraform output -raw function_app_name)\"}}" > ../infra_output.json
          cat ../infra_output.json

      - name: Move Terraform output
        if: env.IAC_TOOL == 'terraform'
        run: |
          mv infra/infra_output.json infra_output.json

      - name: Cleanup on deployment failure
        if: failure() && (steps.deploy-bicep.outcome == 'failure' || steps.deploy-terraform.outcome == 'failure')
        run: |
          echo "Deployment failed. Cleaning up incomplete resources..."
          # Delete orphaned role assignments to allow retry
          az role assignment list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[].name" -o tsv | xargs -I {} \
            az role assignment delete --ids "/subscriptions/$(az account show -q --query id -o tsv)/providers/Microsoft.Authorization/roleAssignments/{}" 2>/dev/null || true
          echo "Cleanup completed"

      - name: Set app name output
        id: setapp
        run: |
          app=$(jq -r '.functionAppName.value // env.FUNCTION_APP_NAME' infra_output.json)
          echo "functionAppName=$app" >> "$GITHUB_OUTPUT"

      - name: Assign RBAC roles to Function App MI (Bicep only)
        if: env.IAC_TOOL == 'bicep'
        run: |
          # Note: Terraform handles RBAC assignments in the template
          # This step is only needed for Bicep deployments
          
          # Get Function App object ID (principal ID)
          PRINCIPAL_ID=$(az functionapp identity show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNCTION_APP_NAME" \
            --query principalId -o tsv)
          
          # Get Storage Account name
          STORAGE_NAME=$(az storage account list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[0].name" -o tsv)
          
          # Get App Configuration name
          APP_CONFIG_NAME=$(az appconfig list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[0].name" -o tsv)
          
          # Assign Contributor role to App Configuration
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --role "Contributor" \
            --scope "/subscriptions/$(az account show -q --query id -o tsv)/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.AppConfiguration/configurationStores/$APP_CONFIG_NAME" \
            2>/dev/null || echo "Role assignment already exists for AppConfig"
          
          # Assign Storage Blob Data Contributor to Storage Account
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --role "Storage Blob Data Contributor" \
            --scope "/subscriptions/$(az account show -q --query id -o tsv)/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$STORAGE_NAME" \
            2>/dev/null || echo "Role assignment already exists for Storage Blob"
          
          # Assign Storage Queue Data Contributor to Storage Account
          az role assignment create \
            --assignee-object-id "$PRINCIPAL_ID" \
            --role "Storage Queue Data Contributor" \
            --scope "/subscriptions/$(az account show -q --query id -o tsv)/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$STORAGE_NAME" \
            2>/dev/null || echo "Role assignment already exists for Storage Queue"

  app:
    name: Deploy Function App
    runs-on: ubuntu-latest
    needs: infra
    env:
      APP_NAME: ${{ needs.infra.outputs.functionAppName }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:     ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:     ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Enable Oryx remote build on the Kudu side (no Basic Auth needed)
      - name: Enable Oryx build (app settings)
        run: |
          az functionapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true ENABLE_ORYX_BUILD=true

      # Zip the source (exclude infra and git clutter)
      - name: Create deployment package
        run: |
          zip -r deploy.zip . \
            -x ".git/*" ".github/*" "infra/*" "__pycache__/*" "*.pyc" "*.pyo"

      # Deploy via ARM -> Kudu using AAD token (no publish profile, no Basic Auth)
      - name: Deploy package (config-zip)
        run: |
          az functionapp deployment source config-zip \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$APP_NAME" \
            --src deploy.zip

      - name: Restart Function App
        run: |
          az functionapp restart --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME"

      - name: Show deployed function_app.py (Kudu)
        run: |
          echo "=== Deployed function_app.py from Kudu ==="
          USER=$(az functionapp deployment list-publishing-credentials --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME" --query publishingUserName -o tsv)
          PWD=$(az functionapp deployment list-publishing-credentials --resource-group "$AZURE_RESOURCE_GROUP" --name "$APP_NAME" --query publishingPassword -o tsv)
          curl -s -u "$USER:$PWD" "https://$APP_NAME.scm.azurewebsites.net/api/vfs/home/site/wwwroot/function_app.py" || echo "Could not fetch function_app.py"

      - name: App URL
        run: |
          echo "App is reachable at: https://$APP_NAME.azurewebsites.net"